{% extends 'admin_base.html' %}

{% block content %}
<div class="row">
    <center>
    <div class="col-md-5">
        <h2>Add Category</h2>
        <hr>
        <form action="{{ url_for('add_category') }}" method="POST" class="bg-white p-4 border rounded shadow-sm">
            <div class="mb-3">
                <label class="form-label">Category Name</label>
                <input type="text" name="cat_name" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Category</button>
        </form>
    </div>
</center>
    </div>
</div>
{% endblock %}
