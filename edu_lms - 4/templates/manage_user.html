{% extends 'admin_base.html' %}

{% block content %}

<style>
    .user-table-container {
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        margin-top: 20px;
    }

    .user-table-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #222;
    }

    .user-table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 10px;
    }

    .user-table th {
        background: #212529;
        color: white;
        padding: 14px;
        text-align: left;
    }

    .user-table td {
        padding: 14px;
        border-bottom: 1px solid #eeeeee;
        color: #333;
    }

    .user-table tbody tr:hover {
        background: #f8f9fa;
    }
</style>

<div class="user-table-container">

    <div class="user-table-title">
        Manage Users
    </div>

    <table class="user-table">

        <thead>
            <tr>
                <th>User ID</th>
                <th>User Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            {% for c in cat %}

            <tr>
                <td><strong>#{{ c.reg_id }}</strong></td>
                <td>{{ c.reg_name }}</td>
                <td>{{ c.reg_email }}</td>
                <td>
                    <a href="{{ url_for('delete_user', user_id=c.reg_id) }}" 
                       class="btn btn-danger btn-sm rounded-pill px-3"
                       onclick="return confirm('Are you sure you want to delete user \'{{ c.reg_name }}\'?');">
                        Delete
                    </a>
                </td>
            </tr>

            {% else %}
            <tr>
                <td colspan="4" class="text-center text-muted py-4">No users found.</td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
