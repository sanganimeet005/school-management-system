{% extends 'base.html' %}

{% block title %}Login - EduPrime{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
                    <div class="text-center mb-4">
                        <div class="bg-primary-subtle text-primary d-inline-flex p-3 rounded-circle fs-3 mb-2">
                            <i class="fa-solid fa-right-to-bracket"></i>
                        </div>
                        <h3 class="fw-bold">Login</h3>
                        <p class="text-muted small">Enter your registered email and password</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email Address</label>
                            <input type="email" name="email" class="form-control rounded-3 py-2" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Password</label>
                            <input type="password" name="password" class="form-control rounded-3 py-2" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-gradient rounded-pill w-100 py-2 fw-semibold mt-3">
                            Login
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
