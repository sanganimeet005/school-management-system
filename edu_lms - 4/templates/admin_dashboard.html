{% extends 'admin_base.html' %}

{% block content %}
<h2>Admin Dashboard</h2>
<hr>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card bg-primary text-white p-4 rounded-3 shadow-sm">
            <h4>Total Registered Students</h4>
            <h2 class="fw-bold">{{ students_count }}</h2>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-success text-white p-4 rounded-3 shadow-sm">
            <h4>Total Courses Available</h4>
            <h2 class="fw-bold">{{ courses_count }}</h2>
        </div>
    </div>
</div>
{% endblock %}
