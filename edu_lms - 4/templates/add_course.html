<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Add Course</h2>
    <hr>

    <form action="/admin/add-course" method="POST"
          enctype="multipart/form-data"
          class="bg-white p-4 border rounded shadow-sm">

        <div class="mb-3">
            <label class="form-label">Category</label><br>
            <input type="text"name="Category" style="width: 100%;">
        </div>

        <div class="mb-3">
            <label class="form-label">Course Name</label><br>

            <input type="text"
                   name="course_name"
                   required style="width: 100%;">
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label><br>

            <input type="number"
                   name="price"
                   required style="width: 100%;">
        </div>

        <div class="mb-3">
            <label class="form-label">Course Image</label>

            <input type="file"
                   name="course_img"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label><br>

            <textarea name="description"
                      rows="3"
                      required style="width: 100%;"></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Save Course
        </button>

    </form>

</div>

</body>
</html>
